# nl-be overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through nl-be, then nl, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 29 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.invalid_chat_name = Ongeldige chat-naam
errors.message_empty = Bericht moet inhoud of bijlagen bevatten
errors.already_left_this_chat = Deze chat al verlaten
errors.delete_only_left_chat = Je kunt alleen chats verwijderen die je verlaten hebt
errors.does_not_accept_chats = Dit lid aanvaardt geen chats van jou
errors.already_member = Reeds lid van deze chat
errors.use_leave_to_remove_yourself = Gebruik 'verlaten' om jezelf te verwijderen
errors.not_your_message = Je kunt enkel je eigen berichten bewerken
