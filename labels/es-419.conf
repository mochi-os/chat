# es-419 overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through es-419, then es, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 28 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.not_a_member_of_this_chat = No es miembro de este chat
errors.already_left_this_chat = Ya salió de este chat
errors.delete_only_left_chat = Solo se pueden eliminar los chats que ha abandonado
errors.member_unreachable = No se pudo contactar a este miembro
errors.already_member = Ya es miembro de este chat
errors.too_many_to_check = Hay demasiadas personas para comprobar a la vez. Crea el chat con un máximo de {maximum} personas que no sean amigos y después agrega el resto.
errors.use_leave_to_remove_yourself = Use salir para retirarse
notifications.body.mentioned_you = {author} te mencionó: {excerpt}
errors.not_your_message = Solo puede editar sus propios mensajes
